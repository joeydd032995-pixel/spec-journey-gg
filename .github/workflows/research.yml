name: Refresh GGBet research
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/research.yml', 'ggbet-analyzer/scripts/research.ts']
permissions:
  contents: write
concurrency:
  group: ggbet-research
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ggbet-analyzer/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ggbet-analyzer
      - name: Restore previous public research state
        run: |
          mkdir -p ggbet-analyzer/research-output
          if git ls-remote --exit-code --heads origin research-data; then
            git fetch origin research-data
            git show FETCH_HEAD:latest.json > ggbet-analyzer/research-output/latest.json
          fi
      - name: Collect and evaluate public league results
        working-directory: ggbet-analyzer
        run: |
          ./node_modules/.bin/esbuild scripts/research.ts --bundle --platform=node --format=esm --outfile=/tmp/ggbet-research.mjs
          node /tmp/ggbet-research.mjs
      - name: Publish research data separately from application code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -R ggbet-analyzer/research-output /tmp/ggbet-research-output
          if git show-ref --verify --quiet refs/remotes/origin/research-data; then
            git switch --force-create research-data origin/research-data
          else
            git switch --orphan research-data
            git rm -rf --ignore-unmatch .
          fi
          cp /tmp/ggbet-research-output/latest.json latest.json
          cp /tmp/ggbet-research-output/report.json report.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add latest.json report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public league research'
            git push origin research-data
          fi
